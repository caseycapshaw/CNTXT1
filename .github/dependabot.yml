# Version updates monthly (grouped into one PR). Security updates for a
# vulnerable action (Dependabot security updates, a repo setting) are
# separate from this schedule and still arrive at once.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
# Checked after the 2026-11 CI change: Dependabot pull requests touch .github/, so they need the code owner.
