# Deterministic privacy & consistency gate — runs on EVERY PR, fork-safe.
# No secrets required. The identifier-sweep job re-runs the gate with
# PERSONAL_IDENTIFIERS (the maintainer's |-separated grep pattern), held on the
# `maintainer-secrets` environment so it only runs after maintainer approval —
# a collaborator's branch can't exfiltrate it. Skipped on forks.
name: PR gate (privacy + consistency)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (Python runner for schema validation + index generators)
        uses: astral-sh/setup-uv@v5

      - name: KB lint (mechanical health)
        run: LINT_STRICT=1 ./SYSTEM/bin/lint.sh

      - name: Optional add-on tests (core-jobs, gardener, remote-access, cloud-core)
        run: |
          python3 -m unittest discover -s SYSTEM/optional/core-jobs/bin/tests
          (cd SYSTEM/optional/core-jobs/lib && python3 -m unittest discover -s tests -p 'test_*.py')
          bash SYSTEM/optional/core-jobs/lib/tests/test-env.sh
          (cd SYSTEM/optional/gardener && python3 -m unittest discover -s tests -p 'test_*.py')
          bash SYSTEM/optional/cloud-core/tests/test-vm-bootstrap.sh
          # remote-access needs `cryptography` (Cloudflare Access RS256 JWT verification)
          (cd SYSTEM/optional/remote-access/capture-api && uv run --no-project --with cryptography python -m unittest discover -s tests -p 'test_*.py')
          (cd SYSTEM/optional/remote-access/mcp-remote && uv run --no-project --with cryptography python -m unittest discover -s tests -p 'test_*.py')

      - name: Privacy & consistency gate
        run: ./.github/scripts/pr-gate.sh

  identifier-sweep:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: maintainer-secrets
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Privacy gate with the maintainer identifier sweep
        env:
          PERSONAL_IDENTIFIERS: ${{ secrets.PERSONAL_IDENTIFIERS }}
        run: ./.github/scripts/pr-gate.sh
